name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js from package.json engines
      uses: actions/setup-node@v7
      with:
        node-version-file: 'package.json'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check code formatting and linting
      run: npm run lint

    - name: Verify TypeScript Compilation
      run: npm run build

    - name: Run Unit Tests
      run: npm run test
